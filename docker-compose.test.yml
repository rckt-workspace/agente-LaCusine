# PostgreSQL DESECHABLE para pruebas de integración. No es producción.
# Datos en tmpfs: al detener el contenedor desaparecen. Solo escucha en loopback.
# Uso:
#   $env:LACUSINE_TEST_PG_PASSWORD = "<contraseña-local>"
#   docker compose -f docker-compose.test.yml up -d
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lacusine_test
      POSTGRES_PASSWORD: ${LACUSINE_TEST_PG_PASSWORD:?defina LACUSINE_TEST_PG_PASSWORD}
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
